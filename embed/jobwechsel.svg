<svg xmlns="http://www.w3.org/2000/svg" width="640" height="212" viewBox="0 0 640 212" font-family="system-ui, sans-serif" role="img" aria-label="Jobwechsel: 4 Fristen"><rect width="640" height="212" fill="#ffffff"/><text x="20" y="38" font-size="17" font-weight="600" fill="#14161a">Jobwechsel: 4 Fristen</text><text x="20" y="58" font-size="12" fill="#4d545e">wannometer.de</text><text x="20" y="72" font-size="13" fill="#4d545e" font-family="monospace">3 Monate vorher</text><text x="190" y="72" font-size="13" fill="#14161a">Bei der Agentur für Arbeit arbeitsuchend melden</text><text x="20" y="102" font-size="13" fill="#4d545e" font-family="monospace">4 Wochen vorher</text><text x="190" y="102" font-size="13" fill="#14161a">Kündigungsfrist einhalten und kündigen</text><text x="20" y="132" font-size="13" fill="#4d545e" font-family="monospace">2 Wochen vorher</text><text x="190" y="132" font-size="13" fill="#14161a">Arbeitszeugnis anfordern und Resturlaub klären</text><text x="20" y="162" font-size="13" fill="#4d545e" font-family="monospace">Letzter Arbeitstag</text><text x="190" y="162" font-size="13" fill="#14161a">Neuen Arbeitgeber und Krankenkasse über Wechsel informieren</text></svg>