<svg xmlns="http://www.w3.org/2000/svg" width="637" height="482" viewBox="0 0 637 482" font-family="system-ui, sans-serif" role="img" aria-label="Umzug: 13 Fristen"><rect width="637" height="482" fill="#ffffff"/><text x="20" y="38" font-size="17" font-weight="600" fill="#14161a">Umzug: 13 Fristen</text><text x="20" y="58" font-size="12" fill="#4d545e">wannometer.de</text><text x="20" y="72" font-size="13" fill="#4d545e" font-family="monospace">Abhängig vom Umzugsmonat</text><text x="231" y="72" font-size="13" fill="#14161a">Wohnung kündigen</text><text x="20" y="102" font-size="13" fill="#4d545e" font-family="monospace">2 Monate vorher</text><text x="231" y="102" font-size="13" fill="#14161a">Umzugsurlaub beim Arbeitgeber beantragen</text><text x="20" y="132" font-size="13" fill="#4d545e" font-family="monospace">6 Wochen vorher</text><text x="231" y="132" font-size="13" fill="#14161a">Internetanbieter kündigen oder umziehen lassen</text><text x="20" y="162" font-size="13" fill="#4d545e" font-family="monospace">4 Wochen vorher</text><text x="231" y="162" font-size="13" fill="#14161a">Termin für die Wohnungsübergabe vereinbaren</text><text x="20" y="192" font-size="13" fill="#4d545e" font-family="monospace">2 Wochen vorher</text><text x="231" y="192" font-size="13" fill="#14161a">Strom- und Gasanbieter über den Umzug informieren</text><text x="20" y="222" font-size="13" fill="#4d545e" font-family="monospace">2 Wochen vorher</text><text x="231" y="222" font-size="13" fill="#14161a">Nachsendeauftrag bei der Post einrichten</text><text x="20" y="252" font-size="13" fill="#4d545e" font-family="monospace">Umzugstag</text><text x="231" y="252" font-size="13" fill="#14161a">Zählerstände ablesen (Strom, Gas, Wasser)</text><text x="20" y="282" font-size="13" fill="#4d545e" font-family="monospace">Umzugstag</text><text x="231" y="282" font-size="13" fill="#14161a">Umzugsgut auf Schäden prüfen</text><text x="20" y="312" font-size="13" fill="#4d545e" font-family="monospace">Umzugstag</text><text x="231" y="312" font-size="13" fill="#14161a">Übergabeprotokoll für die alte Wohnung unterschreiben</text><text x="20" y="342" font-size="13" fill="#4d545e" font-family="monospace">2 Tage danach</text><text x="231" y="342" font-size="13" fill="#14161a">Alte Wohnung besenrein übergeben</text><text x="20" y="372" font-size="13" fill="#4d545e" font-family="monospace">2 Wochen danach</text><text x="231" y="372" font-size="13" fill="#14161a">Ummeldung beim Einwohnermeldeamt</text><text x="20" y="402" font-size="13" fill="#4d545e" font-family="monospace">2 Wochen danach</text><text x="231" y="402" font-size="13" fill="#14161a">Rundfunkbeitrag ummelden</text><text x="20" y="432" font-size="13" fill="#4d545e" font-family="monospace">4 Wochen danach</text><text x="231" y="432" font-size="13" fill="#14161a">Umzugsbelege für die Steuererklärung sammeln</text></svg>